<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Bhuvanesh Kumar — Cybersecurity</title>
<desc id="desc">Animated green terminal header with scanlines, pulsing neon border, blinking cursor and a handwritten-style accent font.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020805"/><stop offset=".55" stop-color="#061b10"/><stop offset="1" stop-color="#001b12"/></linearGradient>
  <linearGradient id="neon"><stop stop-color="#a7f3d0"/><stop offset=".5" stop-color="#22c55e"/><stop offset="1" stop-color="#00ffc3"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#22c55e" stroke-opacity=".09" stroke-width="1"/></pattern>
  <style>
    @keyframes pulse {0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes scan {0%{transform:translateY(-330px)}100%{transform:translateY(330px)}}
    @keyframes blink {0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes drift {0%{transform:translateX(-20px);opacity:.15}50%{opacity:.55}100%{transform:translateX(40px);opacity:.15}}
    @keyframes reveal {0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
    .name{font-family:'Comic Sans MS','Segoe Print','Bradley Hand',cursive;font-weight:700;letter-spacing:1px}
    .mono{font-family:'Courier New',monospace}
    .scan{animation:scan 7s linear infinite}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    .blink{animation:blink 1s steps(1) infinite}
    .drift{animation:drift 5s ease-in-out infinite alternate}
    .reveal{animation:reveal 1.2s ease-out both}
    @media (prefers-reduced-motion:reduce){.scan,.pulse,.blink,.drift,.reveal{animation:none}}
  </style>
</defs>
<rect width="1000" height="300" rx="24" fill="url(#bg)"/>
<rect width="1000" height="300" rx="24" fill="url(#grid)"/>
<g fill="#34d399" opacity=".6" class="mono" font-size="13">
  <text x="35" y="42">root@bhuvanesh:~# whoami</text>
  <text x="35" y="64" opacity=".7">computer-science | python | networking | security</text>
</g>
<g fill="none" stroke="#34d399" stroke-width="1.5" opacity=".8">
  <path d="M28 82V28H82 M918 28H972V82 M28 218V272H82 M918 272H972V218"/>
  <path d="M35 91H115 M885 209H965" stroke-dasharray="3 7" class="drift"/>
</g>
<rect x="20" y="20" width="960" height="260" rx="18" fill="none" stroke="url(#neon)" stroke-width="2" class="pulse" filter="url(#glow)"/>
<g class="scan" opacity=".3"><rect x="20" y="0" width="960" height="3" fill="#00ffc3" filter="url(#glow)"/></g>
<g class="reveal">
  <text x="500" y="128" text-anchor="middle" class="name" font-size="53" fill="#eafff4" filter="url(#glow)">Bhuvanesh Kumar</text>
  <path d="M270 146H730" stroke="url(#neon)" stroke-width="2"/>
  <text x="500" y="178" text-anchor="middle" class="mono" font-size="18" letter-spacing="2" fill="#86efac">ASPIRING PENETRATION TESTER</text>
  <text x="500" y="210" text-anchor="middle" class="mono" font-size="14" fill="#a7f3d0">PYTHON  /  NETWORKING  /  ETHICAL HACKING</text>
  <text x="500" y="244" text-anchor="middle" class="mono" font-size="13" fill="#4ade80">$ learn --build --test-responsibly <tspan class="blink">▌</tspan></text>
</g>
</svg>