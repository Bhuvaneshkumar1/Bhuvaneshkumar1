<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
<defs><linearGradient id="a"><stop stop-color="#071b10"/><stop offset="1" stop-color="#03110b"/></linearGradient>
<style>
@keyframes glow{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
@keyframes appear{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.frame{animation:glow 3s ease-in-out infinite}.content{animation:appear 1s ease-out both}
.script{font-family:'Comic Sans MS','Segoe Print','Bradley Hand',cursive}
.mono{font-family:'Courier New',monospace}
@media(prefers-reduced-motion:reduce){.frame,.content{animation:none}}
</style></defs>
<rect x="2" y="2" width="896" height="186" rx="18" fill="url(#a)" stroke="#22c55e" stroke-width="2" class="frame"/>
